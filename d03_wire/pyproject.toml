[project]
name = "d03-wire"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhijayanoop", email = "abhijayanoop007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
d03-wire = "d03_wire:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
